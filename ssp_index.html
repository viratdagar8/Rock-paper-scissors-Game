<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="ssp_style.css">
</head>
<body>
    <h1>Rock Paper Scissor</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="rock.png"/>
        </div>
        <div class="choice"id="paper">
            <img src="paper.png" />
        </div>
        <div class="choice"id="scissors">
            <img src="scissors.png" alt="">
        </div>
    </div>
    <div class="score-card">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>comp</p>
        </div>
    </div>
    <div class="msg-container">
        <p id="msg">Play next move</p>
    </div>
    <script src="ssp_java.js"></script>
</body>
</html>
